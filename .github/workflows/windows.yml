name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node tests/desktop.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-Windows
          path: release/Alpha-*.exe
