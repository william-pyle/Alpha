name: Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run desktop:test:ui
      - run: npm run desktop:build -- --bundles nsis
      - run: npm run desktop:test:installer
      - run: node desktop/service/test/packaged-runtime.mjs
      - run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Alpha-Windows-installer
          path: |
            release/Alpha-Setup-*.exe
            release/alpha-update.json
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'william-pyle/Alpha'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Alpha-Windows-installer
          path: release
      - name: Publish tested Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @artifacts --draft --verify-tag --title "Alpha $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
